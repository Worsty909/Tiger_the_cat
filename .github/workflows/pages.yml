# Nasazení hry na GitHub Pages.
# Hra sama žádný build nepotřebuje; workflow jen ověří mise a doplní obrázky:
# co v assets/img/ chybí, stáhne podle js/assets.js a převede na webp.
name: Deploy na GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Běží vždy jen jedno nasazení; rozdělané se nechá doběhnout.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Nasazuje se jen z výchozí větve — ale podle toho, která výchozí zrovna je,
    # ne podle jejího jména. Přejmenování větve tak deploy nerozbije.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Kontrola misí
        run: node tools/validate-mission.js

      # Stažené obrázky se drží mezi běhy — každý se stahuje jen jednou.
      - uses: actions/cache@v4
        with:
          path: .image-cache
          key: images-${{ hashFiles('js/assets.js') }}
          restore-keys: images-

      - name: Sestavit web
        run: |
          pip install --quiet pillow
          mkdir -p _site/assets
          cp -r index.html css js _site/
          python3 tools/build-images.py --out _site/assets/img

      # enablement: true zapne Pages i v repozitáři, kde ještě nejsou zapnuté.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
